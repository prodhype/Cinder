name: Build Gen3 ARMv7

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gen3-armv7:
    name: Build gen3 Linux ARMv7
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARMv7 toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            file \
            gcc-arm-linux-gnueabihf \
            qemu-user

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Cinder
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Bootstrap gen2
        run: |
          set -euxo pipefail
          mkdir -p build/bootstrap dist
          cinder build compiler_selfhost \
            -o build/bootstrap/cinder-gen1 \
            --build-dir build/gen1
          ./build/bootstrap/cinder-gen1 build compiler_selfhost \
            -o build/bootstrap/cinder-gen2 \
            --build-dir build/gen2

      - name: Cross-build gen3
        run: |
          set -euxo pipefail
          ./build/bootstrap/cinder-gen2 build compiler_selfhost \
            --cc arm-linux-gnueabihf-gcc \
            -o dist/cinder-gen3-linux-armv7 \
            --build-dir build/gen3-armv7
          chmod +x dist/cinder-gen3-linux-armv7
          file dist/cinder-gen3-linux-armv7

      - name: Verify gen3 with QEMU
        run: |
          set -euxo pipefail
          qemu-arm -L /usr/arm-linux-gnueabihf \
            ./dist/cinder-gen3-linux-armv7 check examples/module_project

      - name: Upload gen3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinder-gen3-linux-armv7
          path: dist/cinder-gen3-linux-armv7
          if-no-files-found: error
