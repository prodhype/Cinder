name: Build Gen3 ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gen3-arm64:
    name: Build gen3 Linux ARM64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Cinder
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Bootstrap gen3
        run: |
          set -euxo pipefail
          mkdir -p build/bootstrap dist
          cinder build compiler_selfhost \
            -o build/bootstrap/cinder-gen1 \
            --build-dir build/gen1
          ./build/bootstrap/cinder-gen1 build compiler_selfhost \
            -o build/bootstrap/cinder-gen2 \
            --build-dir build/gen2
          ./build/bootstrap/cinder-gen2 build compiler_selfhost \
            -o dist/cinder-gen3-linux-arm64 \
            --build-dir build/gen3
          chmod +x dist/cinder-gen3-linux-arm64

      - name: Verify gen3
        run: |
          set -euxo pipefail
          ./dist/cinder-gen3-linux-arm64 check examples/module_project

      - name: Upload gen3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinder-gen3-linux-arm64
          path: dist/cinder-gen3-linux-arm64
          if-no-files-found: error
