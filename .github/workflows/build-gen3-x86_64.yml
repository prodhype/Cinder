name: Build Gen3 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gen3-x86_64:
    name: Build gen3 Linux x86_64
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Cinder
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Bootstrap gen3
        run: |
          set -euxo pipefail
          mkdir -p build/bootstrap dist/cinder-gen3-linux-x86_64
          cinder build compiler_selfhost \
            -o build/bootstrap/cinder-gen1 \
            --build-dir build/gen1
          ./build/bootstrap/cinder-gen1 build compiler_selfhost \
            -o build/bootstrap/cinder-gen2 \
            --build-dir build/gen2
          ./build/bootstrap/cinder-gen2 build compiler_selfhost \
            -o dist/cinder-gen3-linux-x86_64/cinder \
            --build-dir build/gen3
          chmod +x dist/cinder-gen3-linux-x86_64/cinder

      - name: Bundle runtime files
        run: |
          set -euxo pipefail
          mkdir -p dist/cinder-gen3-linux-x86_64/runtime
          cp cinder/runtime/cinder_runtime.c \
            cinder/runtime/cinder_runtime.h \
            dist/cinder-gen3-linux-x86_64/runtime/

      - name: Verify gen3
        run: |
          set -euxo pipefail
          ./dist/cinder-gen3-linux-x86_64/cinder check examples/module_project

      - name: Archive gen3 bundle
        run: |
          set -euxo pipefail
          COPYFILE_DISABLE=1 tar -czf dist/cinder-gen3-linux-x86_64.tar.gz \
            -C dist cinder-gen3-linux-x86_64

      - name: Upload gen3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinder-gen3-linux-x86_64
          path: dist/cinder-gen3-linux-x86_64.tar.gz
          if-no-files-found: error
